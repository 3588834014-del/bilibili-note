name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.8 已 EOL（2024-10），这里从声明的最低版本 3.8 开始测，
        # 以验证 pyproject 的 requires-python 不是空话。
        python-version: ["3.8", "3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 刻意不装任何第三方包：本 skill 只用标准库，装上反而掩盖了意外的依赖。
      - name: Show Python version
        run: python --version

      - name: Compile check
        run: python -m py_compile scripts/bili_note.py scripts/install.py

      - name: Run offline test suite
        run: python -m unittest discover -s tests -v
        env:
          PYTHONIOENCODING: utf-8

      - name: CLI smoke test
        run: |
          python scripts/bili_note.py --version
          python scripts/bili_note.py --help

      - name: Install script dry run
        run: python scripts/install.py --dry-run
        env:
          PYTHONIOENCODING: utf-8
