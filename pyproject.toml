[project]
name = "bilibili-note"
version = "1.1.0"
description = "把 B站视频的字幕取下来，生成结构化 Obsidian 笔记的 CLI 与 agent skill（只拉字幕，不下载视频）"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["obsidian", "bilibili", "yt-dlp", "subtitle", "notes", "cli", "skill", "markdown"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]

# 刻意不声明任何依赖：本工具只用标准库。
# yt-dlp 是**外部命令**依赖（不是 Python 包依赖），见 README 的 Requirements。
dependencies = []

[project.optional-dependencies]
# yt-dlp 也提供 Python 包；装了这个就不必单独装 CLI
ytdlp = ["yt-dlp>=2024.1.1"]

[project.scripts]
bili-note = "bili_note_cli.cli:main"

[project.urls]
Homepage = "https://github.com/3588834014-del/bilibili-note"
Issues = "https://github.com/3588834014-del/bilibili-note/issues"
Changelog = "https://github.com/3588834014-del/bilibili-note/blob/main/CHANGELOG.md"

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # 中文注释与长 URL 无法可靠折行

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]          # 测试需要先把 scripts/ 插进 sys.path 再 import
"bili_note_cli/*" = ["E402"]  # 入口点按需延迟导入，避免装不上时 import 就炸

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# 唯一实现仍是 scripts/bili_note.py；这里把它作为顶层模块 `bili_note` 装进去，
# 这样 CLI 包和 dsh skill 用的是**同一份代码**，不会出现两个版本行为不一致。
# 用 package-dir 映射，避免为了打包而挪动文件（挪了 skill 就找不到它了）。
package-dir = { "" = "scripts", bili_note_cli = "bili_note_cli" }
py-modules = ["bili_note"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bili_note_cli*"]
